# ========================
# Glyph Positioning
# ========================
# anchor:
#   type: BASE/ABOVE/BELOW Anchor positioning class
#   mark:
#     mkmk: Mark-To-Mark anchor
#     base: Base-To-Mark anchor
#   base:
#     above: Above marks anchor
#     below: below marks anchor
# pos:
#   x: Move glyph horizontally in pixels
#   y: Move glyph vertically in pixels
# ========================
#
# Anchor type (classes):
#
# ABOVE:
#   Mark glyph positioned above a base glyph.
#   Glyph has zero advance width and is positioned at
#   the left-hand side of the typing cursor.
#
#   defaults at: font.yml/profile.typography.above-marks
# BELOW:
#   Mark glyph positioned below a base glyph.
#   Glyph has zero advance width and is positioned at
#   the left-hand side of the typing cursor.
#
#   defaults at: font.yml/profile.typography.below-marks
# BASE:
#   Base glyph providing an attachment point.
#   Anchor is positioned relative to the glyph boundary.
#
#   default anchors are place at bottom right and top right of the glyph boundary


