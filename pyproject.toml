[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seafront-font"
dynamic = ["version"]
description = "Development toolkit for Seafront Fonts. A pixelated style typeface developed by the BuildTheEarth Community."
readme = "README.md"
license = "OFL-1.1"
license-files = ["LICEN[CS]E*"]
authors = [
  {name = "Tin", email = "tintinkung.lemonade@gmail.com"},
]
maintainers = [
  {name = "Tin", email = "tintinkung.lemonade@gmail.com"}
]
requires-python = ">=3.13"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Graphics",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: SIL Open Font License 1.1 (OFL-1.1)"
]
dependencies = [
    "fonttools==4.66.1",
    "pillow==12.3.0",
    "pyyaml==6.0.3",
    "pytest==9.1.1"
]

[project.optional-dependencies]
plotting = [
    "cycler==0.12.1",
    "matplotlib==3.11.2",
]
ci = ["gitpython==3.2.0"]

[project.urls]
Homepage = "https://asean.buildtheearth.asia/"
Documentation = "https://github.com/ASEAN-Build-The-Earth/Seafront-Font/wiki"
Repository = "https://github.com/ASEAN-Build-The-Earth/Seafront-Font.git"
Issues = "https://github.com/ASEAN-Build-The-Earth/Seafront-Font/issues"
Changelog = "https://github.com/ASEAN-Build-The-Earth/Seafront-Font/releases"

[tool.hatch.version]
path = "src/seafront/__about__.py"

[tool.pytest.ini_options]
testpaths = ["tests/*", "src/seafront/unicode.py"]
addopts = ["-v", "--doctest-modules"] # rn only unicode.py have doctest

[project.scripts]
save-project-with = "scripts.save_project_with:main"
generate-project = "scripts.generate_project:main"
export-seafront = "scripts.export_seafront:main"
verify-project = "scripts.ci.verify_project:main"

[tool.hatch.envs.verify]
dependencies = ["gitpython"]

[tool.hatch.envs.verify.scripts]
project = "verify-project {args}"

[tool.hatch.build.targets.sdist]
include = ["/src", "/projects", "/scripts", "/font", "/tests", "/assets"]

[tool.hatch.build.targets.wheel]
packages = ["src/seafront", "scripts"]
