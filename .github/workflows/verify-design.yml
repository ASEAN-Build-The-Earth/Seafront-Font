name: Verify Design

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "projects/**"
      - "assets/**"
      - "font/**"
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/verify_design.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: Verify generated design files
    runs-on: ubuntu-latest

    steps:
      # Checkout the base revision
      # IMPORTANT: For safety, please never check out any
      #            other revision outside upstream base
      - name: Checkout trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      # Overlay only the PR's projects/design data.
      - name: Overlay pull request projects
        run: |
          git checkout \
            "${{ github.event.pull_request.head.sha }}" \
            -- projects/

      - name: Check project files
        run: |
          if find projects -type l -print -quit | grep -q .; then
            echo "::error::Symlinks are not permitted in projects/"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Hatch
        run: pipx install hatch

      - name: Setup Aseprite
        uses: neomura/setup-aseprite-cli-action@v1.0.6

      # Verify /projects directory, which saves any sync updates.
      # Report files are under font/cover/saves-{base}-{head}.(json|html)
      - name: Verify project
        id: verify
        continue-on-error: true
        run: |
          hatch run verify:project \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --json \
            --html \
            --identifier="design-verification" \
            --sync-token="{{PATCH_URL}}"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      # Build a binary git diff against the
      # PR HEAD without touching the real git index.
      # Note: that the diff's comparison comes from
      #       the updated /projects tree from verify step
      - name: Generate sync patch
        id: patch
        if: always()
        run: |
          BASE_SHORT="${BASE_SHA:0:7}"
          HEAD_SHORT="${HEAD_SHA:0:7}"

          patch="sync-${BASE_SHORT}-${HEAD_SHORT}.patch"
          tmp_index="$(mktemp)"

          trap 'rm -f "$tmp_index"' EXIT

          GIT_INDEX_FILE="$tmp_index" git read-tree "$HEAD_SHA"

          GIT_INDEX_FILE="$tmp_index" \
            git add -A -- projects/

          GIT_INDEX_FILE="$tmp_index" \
            git diff --cached --binary "$HEAD_SHA" -- projects/ \
            > "$patch"

          echo "patch=$patch" >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Save PR details
        id: details
        if: always()
        run: |
          BASE_SHORT="${BASE_SHA:0:7}"
          HEAD_SHORT="${HEAD_SHA:0:7}"

          echo "base_short=$BASE_SHORT" >> "$GITHUB_OUTPUT"
          echo "head_short=$HEAD_SHORT" >> "$GITHUB_OUTPUT"
          echo "report_json=font/cover/saves-${BASE_SHORT}-${HEAD_SHORT}.json" >> "$GITHUB_OUTPUT"
          echo "report_html=font/cover/saves-${BASE_SHORT}-${HEAD_SHORT}.html" >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: design-verification
          path: |
            ${{ steps.details.outputs.report_json }}
            ${{ steps.details.outputs.report_html }}
            ${{ steps.patch.outputs.patch }}

      - name: Update PR report
        if: always()
        uses: actions/github-script@v9
        env:
          REPORT_HTML: ${{ steps.details.outputs.report_html }}
          PATCH_FILE: ${{ steps.patch.outputs.patch }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- design-verification -->";
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}/artifacts`;

            let html = fs.readFileSync(process.env.REPORT_HTML, "utf8");
            html = html.replaceAll("{{PATCH_URL}}", artifactUrl);
            const body = html.includes(marker) ? html : `${marker}\n${html}`;
            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });

            const existing = comments.find(comment =>
              comment.user?.type === "Bot" &&
              comment.body?.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Workflow outcome will be from verify step
      - name: Fail verification
        if: steps.verify.outcome != 'success'
        run: exit 1